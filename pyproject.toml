[project]
name = "trunk-filtering"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
  { name = "kpetrakis-eden", email = "kostispetrak@edencore.ai" }
]
requires-python = ">=3.11"
dependencies = [
  "ipykernel>=7.4.0",
  "matplotlib>=3.11.2",
  "numpy>=2.4.6",
  "opencv-python>=5.0.0.93",
  "pandas>=3.0.6",
  "scikit-learn>=1.9.1",
  "scipy>=1.17.1",
  "torch==2.6.0",
  "torchvision==0.21.0",
  "tqdm>=4.70.1",
  "transformers>=5.19.0",
]

[project.scripts]
trunk-filtering = "trunk_filtering:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

